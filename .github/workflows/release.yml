# Release pipeline: on a version tag (v*), build multi-arch images for every
# component, push to GHCR, and attach the vapn/vapnctl CLI binaries plus the
# worker install script to the GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # keygen is included so operators can generate a snapshot signing
        # keypair with `docker run --rm ghcr.io/.../vapn-keygen` instead of
        # building it locally (docs/builder/installation.md step 3).
        component: [coordinator, aggregator, builder, migrate, worker, mockadvisor, keygen]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: COMPONENT=${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/hummingbytedev/vapn-${{ matrix.component }}:${{ github.ref_name }}
            ghcr.io/hummingbytedev/vapn-${{ matrix.component }}:latest

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build CLIs
        run: |
          mkdir -p dist
          VER=${{ github.ref_name }}
          LDFLAGS="-s -w -X github.com/HummingByteDev/vpsa-network-discovery/internal/platform/version.Version=$VER"
          for bin in vapn vapnctl; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
                go build -ldflags "$LDFLAGS" -o dist/$bin-linux-$arch ./cmd/$bin
            done
          done
          cp deploy/worker/install.sh dist/install.sh
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
