name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vapn
          POSTGRES_PASSWORD: vapn-dev
          POSTGRES_DB: vapn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vapn -d vapn"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Vet
        run: go vet ./...
      - name: Test (includes DB integration tests)
        env:
          VAPN_TEST_DB_DSN: postgres://vapn:vapn-dev@localhost:5432/vapn
        run: go test -p 1 ./...
      - name: Build
        run: go build -o bin/ ./cmd/...
      - name: Apply migrations against a fresh database
        env:
          VAPN_DB_DSN: postgres://vapn:vapn-dev@localhost:5432/vapn
        run: ./bin/migrate
      - name: Migrations are idempotent
        env:
          VAPN_DB_DSN: postgres://vapn:vapn-dev@localhost:5432/vapn
        run: ./bin/migrate
