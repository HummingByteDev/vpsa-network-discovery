global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: coordinator
    static_configs:
      - targets: ["coordinator:8080"]
  - job_name: aggregator
    static_configs:
      - targets: ["aggregator:8082"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# Alert delivery: point alerting.alertmanagers at your Alertmanager, or use
# Grafana alerting on top of these same expressions. The rules in alerts.yml
# are the contract either way.
